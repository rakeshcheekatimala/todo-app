version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "4100:4100"
    environment:
      - REACT_APP_API_URL=http://localhost:4300
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build: ./backend
    ports:
      - "4300:4300"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/todo-app
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: 